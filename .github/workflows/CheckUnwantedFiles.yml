name: CheckUnwantedFiles

on:
  # Triggered from GitHub - Actions
  workflow_dispatch:
  # Triggered upon push to the master branch
  push:
    branches:
      - master

# Edit the lists here when neccessary
env:
  UNWANTED_NAME_PATTERNS: "*.pdb *.ilk *.user *.ncb *.suo *.log *.dmp *.zip imgui.ini desktop.ini dxcompiler.dll dxil.dll"
  UNWANTED_DIR_PATTERNS: "generated Generated .vs logs Logs dumps Dumps"

jobs:
  check-files:
    name: 不要なファイルを検索
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 不要なファイルとディレクトリを検索 (bash)
        # ディレクトリ条件を構築（最初の不要な -o を unset DIR_CONDITIONS[0] で削除）
        run: |
          DIR_CONDITIONS=()
          for pattern in $UNWANTED_DIR_PATTERNS$; do
            DIR_CONDITIONS+=(-o -iname "$pattern")
          done
          unset DIR_CONDITIONS[0]

          NAME_CONDITIONS=()
          for pattern in $UNWANTED_NAME_PATTERNS$; do
            NAME_CONDITIONS+=(-o -iname "$pattern")
          done
          unset NAME_CONDITIONS[0]

          UNWANTED_LIST=$( \
            find . -path "./.git" -prune -o \
            \( \( "${DIR_CONDITIONS[@]}" \) -a -type d -print -prune \) -o \
            \( \( "${NAME_CONDITIONS[@]}" \) -a -type f -print \) \
          )

          if [ -n "$UNWANTED_LIST" ]; then
            echo "::error::不要なファイルまたはディレクトリが見つかりました！"
            echo "$UNWANTED_LIST"
            exit 1
          fi

          echo "リポジトリはクリーンです。"